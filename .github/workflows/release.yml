name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run semantic-release in dry-run mode (no publish, no tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch against main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release can only be dispatched against refs/heads/main (got ${{ github.ref }})."
          exit 1
  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter three-llm build
      - name: Release through npm trusted publishing
        run: pnpm release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        if: always()
        run: |
          {
            echo "### Release run"
            echo "- ref: ${{ github.ref }} @ ${{ github.sha }}"
            echo "- dry run: ${{ inputs.dry_run }}"
            echo "semantic-release reports directly above whether a release was published or skipped as a no-op."
          } >> "$GITHUB_STEP_SUMMARY"
